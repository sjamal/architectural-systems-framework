# Demonstrates Dual-Justification Principle:
# Serves simultaneously as an ingress router and an observability tracing agent.

http {
    upstream backend_nodes {
        server 10.0.1.10:8080;
        server 10.0.1.11:8080;
    }

    server {
        listen 80;

        location /api/ {
            # Function 1: Traffic Routing & Availability
            proxy_pass http://backend_nodes;
            
            # Function 2: Distributed Trace Propagation (Observability)
            proxy_set_header X-Request-ID $request_id;
            
            # Function 3: Rate Limiting (Security/Protection)
            limit_req zone=api_limit burst=10;
        }
    }
}
