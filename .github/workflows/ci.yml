name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Examples, tests, and Markdown links
        run: ./scripts/init_repo.sh check
      - name: Validate nginx example
        run: docker run --rm -v "$PWD/code-examples:/examples:ro" nginx:stable nginx -t -c /examples/nginx_dual_purpose.conf
